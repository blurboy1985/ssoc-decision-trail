<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSOC Decision Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #cfd8e3;
    --panel: #ffffff;
    --ink: #5a6782;
    --ink-strong: #2b3448;
    --seg: #cdd5e0;
    --red: #d9606e;
    --red-dark: #a3243a;
    --orange: #e5683a;
    --gold: #c9952b;
    --grey: #6f6a62;
    --focus: #2b3448;
    --head: "Barlow Semi Condensed", system-ui, sans-serif;
    --body: "IBM Plex Sans", system-ui, sans-serif;
    --pixel: "Pixelify Sans", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink-strong); font: 15px/1.5 var(--body); }
  header { padding: 20px 24px 8px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
  h1 { margin: 0; font: 700 30px/1.1 var(--head); letter-spacing: .2px; }
  header p { margin: 0; color: var(--ink); max-width: 70ch; }
  main { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 20px; padding: 12px 24px 40px; align-items: start; }
  @media (max-width: 1000px) { main { grid-template-columns: minmax(0, 1fr); padding: 8px 16px 32px; } header { padding: 16px 16px 4px; } }

  .box { background: var(--panel); border: 4px solid var(--ink); box-shadow: 4px 4px 0 rgba(43,52,72,.18); padding: 16px; }
  .box h2 { margin: 0 0 10px; font: 700 20px/1.2 var(--head); }
  label { display: block; font: 600 12px/1.4 var(--pixel); letter-spacing: .6px; text-transform: uppercase; color: var(--ink); margin: 12px 0 4px; }
  input, textarea { width: 100%; font: 14px/1.45 var(--body); color: var(--ink-strong); background: #f6f8fb; border: 3px solid var(--ink); padding: 8px 10px; border-radius: 0; }
  textarea { min-height: 220px; resize: vertical; }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; min-width: 0; }
  button { font: 600 14px/1 var(--pixel); letter-spacing: .5px; color: #fff; background: var(--ink); border: 0; padding: 10px 14px; cursor: pointer; box-shadow: inset -3px -3px 0 rgba(0,0,0,.25); }
  button:hover:not(:disabled) { background: var(--ink-strong); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--red); width: 100%; margin-top: 14px; font-size: 17px; padding: 14px; }
  button.primary:hover:not(:disabled) { background: var(--red-dark); }
  button.ghost { background: transparent; color: var(--ink-strong); box-shadow: inset 0 0 0 3px var(--ink); }
  button.ghost:hover:not(:disabled) { background: #eef2f7; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chips button { font: 500 13px/1.2 var(--body); padding: 6px 9px; background: #eef2f7; color: var(--ink-strong); box-shadow: inset 0 0 0 2px var(--ink); }
  .chips button:hover:not(:disabled) { background: #dfe6ef; }
  .hint { font-size: 13px; color: var(--ink); margin: 6px 0 0; }
  .status { min-height: 1.5em; margin: 10px 0 0; font-size: 13px; color: var(--ink); }
  .status.err { color: var(--red-dark); font-weight: 600; }
  .ref { margin-top: 10px; font-size: 13px; background: #f6f8fb; border-left: 4px solid var(--gold); padding: 6px 10px; }

  .stage { min-width: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .controls .sp { flex: 1; }
  .controls .meta { font: 13px/1.3 var(--pixel); color: var(--ink); }
  #canvasWrap { background: var(--panel); border: 4px solid var(--ink); box-shadow: 4px 4px 0 rgba(43,52,72,.18); }
  canvas { display: block; width: 100%; image-rendering: pixelated; cursor: default; }

  #log { margin-top: 20px; }
  #log details { border-top: 2px dashed var(--seg); padding: 8px 0; }
  #log summary { cursor: pointer; font: 600 16px/1.4 var(--head); }
  #log summary span { font: 400 13px var(--body); color: var(--ink); margin-left: 6px; }
  .q { margin: 10px 0 14px; }
  .q h4 { margin: 0 0 6px; font: 600 14px/1.35 var(--body); }
  .q h4 small { font-weight: 400; color: var(--ink); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 3px 6px; vertical-align: middle; }
  td.code { font: 13px var(--pixel); width: 60px; color: var(--ink); }
  td.pct { width: 64px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  td.bar { width: 34%; }
  .pbar { height: 10px; background: var(--seg); }
  .pbar i { display: block; height: 100%; background: var(--red); }
  tr.win td { color: var(--red-dark); font-weight: 600; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header>
  <h1>SSOC 2024 Decision Trail</h1>
  <p>Watch TypeSafe Jev walk the Singapore Standard Occupational Classification tree, one level at a time, until one occupation code is left standing.</p>
</header>
<main>
  <section class="box" aria-labelledby="inTitle">
    <h2 id="inTitle">Job description</h2>
    <label for="mcfUrl">MyCareersFuture link (optional)</label>
    <div class="row">
      <input id="mcfUrl" placeholder="https://www.mycareersfuture.gov.sg/job/…" autocomplete="off">
      <button id="loadBtn" type="button">Load</button>
    </div>
    <label>Or try a real posting</label>
    <div class="chips" id="samples"></div>
    <label for="jobTitle">Job title</label>
    <input id="jobTitle" placeholder="e.g. Senior Software Engineer">
    <label for="jobDesc">Description</label>
    <textarea id="jobDesc" placeholder="Paste the duties, requirements and skills…"></textarea>
    <div id="ref" class="ref" hidden></div>
    <button id="runBtn" class="primary" type="button">Classify ▶</button>
    <p class="status" id="status" role="status"></p>
  </section>

  <section class="stage" aria-label="Decision visualisation">
    <div class="controls">
      <button id="prevBtn" class="ghost" type="button" aria-label="Previous step">◀ Prev</button>
      <button id="playBtn" class="ghost" type="button">❚❚ Pause</button>
      <button id="nextBtn" class="ghost" type="button" aria-label="Next step">Next ▶</button>
      <button id="replayBtn" class="ghost" type="button">↺ Replay</button>
      <span class="sp"></span>
      <span class="meta" id="meta"></span>
    </div>
    <div id="canvasWrap"><canvas id="scene" role="img" aria-label="Animated decision trail"></canvas></div>
    <p class="sr" id="sceneText" aria-live="polite"></p>
    <section id="log" aria-label="Decision log"></section>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
